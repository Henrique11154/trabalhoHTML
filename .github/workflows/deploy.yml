name: Deploy site HTML para GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site

          # Copia os arquivos HTML
          cp -r HTML _site/

          # Copia CSS
          cp -r css _site/

          # Copia imagens
          cp -r imagens _site/

          # Cria uma página inicial na raiz
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-br">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=HTML/index.html">
            <title>Shadow of the Colossus</title>
          </head>
          <body>
            <p>Redirecionando...</p>
            <a href="HTML/index.html">Entrar no site</a>
          </body>
          </html>
          EOF

      - name: Fazer upload do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4